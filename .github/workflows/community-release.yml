name: Publish community release

# Explicit publication without Apple notarization or Windows Authenticode.
# Update signatures and version verification remain mandatory on every platform.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version on main to publish (OS publisher verification is not included)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require update signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Create the versioned draft release
        id: draft
        run: |
          VERSION=$(node scripts/release.mjs version)
          [ "$REQUESTED_VERSION" = "$VERSION" ] || { echo 'Requested version must match main'; exit 1; }
          status=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --include 2>&1) && { echo 'Tag already exists'; exit 1; }
          [[ "$status" == *'HTTP 404'* ]] || { echo 'Unable to verify tag availability'; exit 1; }
          if gh release view "v$VERSION" --json isDraft,assets > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true and (.assets | length) == 0' existing-release.json
            gh release edit "v$VERSION" --target "$RELEASE_SHA" --title "SlateDB v$VERSION" --notes-file docs/community-release-notes.md
          else
            gh release create "v$VERSION" --target "$RELEASE_SHA" --draft --title "SlateDB v$VERSION" --notes-file docs/community-release-notes.md
          fi
          RELEASE_ID=$(gh release view "v$VERSION" --json databaseId --jq .databaseId)
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing draft release ID'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build installers with signed update payloads
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc signing preserves binary integrity; it is not Apple notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          tauriScript: bun run tauri
          includeUpdaterJson: false
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all update payloads and generate the manifest
        run: |
          bash scripts/install-minisign.sh
          mkdir release-assets
          gh release download "v$VERSION" --dir release-assets
          node scripts/release.mjs assets release-assets "$VERSION" "$GH_REPO" docs/community-release-notes.md
          gh release upload "v$VERSION" release-assets/latest.json release-assets/SHA256SUMS release-assets/updater.pub
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*
      - name: Publish the complete community release
        run: gh release edit "v$VERSION" --draft=false --latest
