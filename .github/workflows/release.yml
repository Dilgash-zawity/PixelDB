name: Build and release

# Pull requests build unsigned installers without any secrets.
# Run the workflow manually from main with a version to publish that release:
# every platform builds the same commit with signed update payloads, then the
# release is published only after every build and the manifest check succeed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version on main to publish (macOS and Windows are signed when their credentials are configured)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      apple_signing: ${{ steps.os-signing.outputs.apple }}
      windows_signing: ${{ steps.os-signing.outputs.windows }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require update signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      # Publisher signing turns on per platform once all of its credentials exist
      # (docs/RELEASING.md); a partial set fails rather than shipping half-signed.
      - name: Check macOS and Windows signing credentials
        id: os-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: |
          check() {
            local platform=$1; shift
            local set=0
            for name in "$@"; do [ -n "${!name}" ] && set=$((set + 1)); done
            if [ "$set" -eq "$#" ]; then echo "$platform=true" >> "$GITHUB_OUTPUT"; echo "$platform: signed" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$set" -eq 0 ]; then echo "$platform=false" >> "$GITHUB_OUTPUT"; echo "$platform: not signed (no credentials)" >> "$GITHUB_STEP_SUMMARY"
            else echo "Some but not all $platform signing credentials are set: $*"; exit 1; fi
          }
          check apple APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          check windows AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERTIFICATE_PROFILE
      - name: Create the versioned draft release
        id: draft
        run: |
          VERSION=$(node scripts/release.mjs version)
          [ "$REQUESTED_VERSION" = "$VERSION" ] || { echo 'Requested version must match main'; exit 1; }
          status=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --include 2>&1) && { echo 'Tag already exists'; exit 1; }
          [[ "$status" == *'HTTP 404'* ]] || { echo 'Unable to verify tag availability'; exit 1; }
          if gh release view "v$VERSION" --json isDraft,assets > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true and (.assets | length) == 0' existing-release.json
            gh release edit "v$VERSION" --target "$RELEASE_SHA" --title "SlateDB v$VERSION" --notes-file docs/community-release-notes.md
          else
            gh release create "v$VERSION" --target "$RELEASE_SHA" --draft --title "SlateDB v$VERSION" --notes-file docs/community-release-notes.md
          fi
          RELEASE_ID=$(gh release view "v$VERSION" --json databaseId --jq .databaseId)
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing draft release ID'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Runs for pull requests (prepare skipped) and for releases (prepare succeeded).
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Configure Windows Artifact Signing
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        shell: bash
        run: |
          cargo install artifact-signing-cli --locked
          node scripts/release.mjs windows-config
      # Re-exports the Developer ID as a .p12 the macOS keychain can import (or
      # fails here, in seconds, saying what is wrong with the secrets).
      - name: Prepare the Developer ID certificate
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          p12=$(bash scripts/prepare-apple-certificate.sh)
          echo "::add-mask::$p12"
          echo "APPLE_CERTIFICATE_P12=$p12" >> "$GITHUB_ENV"
      # Pull requests never receive signing secrets or publish unsigned installers.
      - name: Build unsigned installers for a pull request
        if: github.event_name == 'pull_request'
        run: bun run tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
      - name: Build installers with signed update payloads
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # With a Developer ID, Tauri signs and notarizes; without one, ad-hoc
          # signing keeps binary integrity (it is not Apple notarization).
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true' && env.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (needs.prepare.outputs.apple_signing == 'true' && secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true' && secrets.AZURE_TENANT_ID || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true' && '--config tauri-signing.windows.json' || '' }}
          tauriScript: bun run tauri
          # The publish job writes the manifest once to avoid concurrent writes.
          includeUpdaterJson: false
      - name: Verify macOS signature and notarization
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS' && needs.prepare.outputs.apple_signing == 'true'
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            count=$((count + 1))
          done < <(find src-tauri/target -path '*/bundle/macos/SlateDB.app' -type d -prune -print0)
          [ "$count" -gt 0 ]
      - name: Verify Windows Authenticode signatures
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && needs.prepare.outputs.windows_signing == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item src-tauri/target/release/SlateDB.exe) + @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -lt 2) { throw 'Expected the app and installer' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($file.Name)" }
          }

  publish:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all update payloads and generate the manifest
        run: |
          bash scripts/install-minisign.sh
          mkdir release-assets
          gh release download "v$VERSION" --dir release-assets
          node scripts/release.mjs assets release-assets "$VERSION" "$GH_REPO" docs/community-release-notes.md
          gh release upload "v$VERSION" release-assets/latest.json release-assets/SHA256SUMS release-assets/updater.pub
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*
      - name: Publish the complete release
        run: gh release edit "v$VERSION" --draft=false --latest
