name: release

# Two modes:
# - pull_request into main: build every platform and stop. Nothing is published.
# - workflow_dispatch with a PR number (started only after the build is approved):
#   merge that PR into main, build main again, and publish the GitHub release
#   for the version in src-tauri/tauri.conf.json (tag v<version>).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to merge into main and publish'
        required: true
        type: string

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr }}
      REPO: ${{ github.repository }}
    steps:
      - name: check the version has no release yet
        run: |
          HEAD_REF=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          VERSION=$(gh api "repos/$REPO/contents/src-tauri/tauri.conf.json?ref=$HEAD_REF" --jq .content \
            | base64 -d | grep -m1 '"version"' | sed 's/.*"\([0-9.]*\)".*/\1/')
          echo "Publishing version $VERSION from $HEAD_REF"
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "tag v$VERSION already exists; bump the version in the PR first"
            exit 1
          fi

      - name: merge the pull request into main
        run: gh pr merge "$PR" --merge

  publish-tauri:
    needs: merge
    # Runs on PR builds (merge skipped) and on publish runs after a successful merge.
    if: ${{ always() && needs.merge.result != 'failure' && needs.merge.result != 'cancelled' }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'

          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'

          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # A publish run must build main after the merge, not the commit the run started on.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: build (pull request check)
        if: github.event_name == 'pull_request'
        run: bun run tauri build ${{ matrix.args }}

      - name: build and publish release
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'SlateDB v__VERSION__'
          releaseBody: |
            ## Download SlateDB

            | Platform | Installer |
            |----------|-----------|
            | Windows | [Download EXE](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/SlateDB___VERSION___x64-setup.exe) |
            | macOS (Apple Silicon) | [Download DMG](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/SlateDB___VERSION___aarch64.dmg) |
            | macOS (Intel) | [Download DMG](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/SlateDB___VERSION___x64.dmg) |
            | Ubuntu / Debian | [Download DEB](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/SlateDB___VERSION___amd64.deb) |
            | Linux (AppImage) | [Download AppImage](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/SlateDB___VERSION___amd64.AppImage) |

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
