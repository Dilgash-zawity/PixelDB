name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'

          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'

          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'SlateDB v__VERSION__'
          releaseBody: |
            ## Download SlateDB

            | Platform | Installer |
            |----------|-----------|
            | Windows | [Download EXE](https://github.com/Dilgash-zawity/Base/releases/download/v__VERSION__/SlateDB___VERSION___x64-setup.exe) |
            | macOS (Apple Silicon) | [Download DMG](https://github.com/Dilgash-zawity/Base/releases/download/v__VERSION__/SlateDB___VERSION___aarch64.dmg) |
            | macOS (Intel) | [Download DMG](https://github.com/Dilgash-zawity/Base/releases/download/v__VERSION__/SlateDB___VERSION___x64.dmg) |
            | Ubuntu / Debian | [Download DEB](https://github.com/Dilgash-zawity/Base/releases/download/v__VERSION__/SlateDB___VERSION___amd64.deb) |
            | Linux (AppImage) | [Download AppImage](https://github.com/Dilgash-zawity/Base/releases/download/v__VERSION__/SlateDB___VERSION___amd64.AppImage) |

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
