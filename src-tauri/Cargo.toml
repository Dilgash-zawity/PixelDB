[package]
name = "SlateDB"
version = "0.0.14"
description = "SlateDB — an offline desktop database builder"
authors = ["Dilgash"]
license = "MIT"
repository = "https://github.com/Dilgash-zawity/SlateDB"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.37", features = ["bundled", "blob", "column_decltype", "column_metadata", "functions"] }
thiserror = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Online databases: connection tests for PostgreSQL/MySQL hosts and Turso (libSQL over HTTP).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["time"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
