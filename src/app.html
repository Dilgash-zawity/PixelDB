<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// First launch defaults to dark mode (mode-watcher persists "system" on load otherwise).
			try {
				if (!localStorage.getItem('mode-watcher-mode')) localStorage.setItem('mode-watcher-mode', 'dark');
			} catch {}
			// Apply saved look-and-feel settings before first paint (mirrors logic/settings.ts).
			try {
				var s = JSON.parse(localStorage.getItem('pixeldb.settings') || '{}') || {};
				var el = document.documentElement;
				if (s.accent && s.accent !== 'neutral') el.setAttribute('data-ui-accent', s.accent);
				if (s.focusMode === true) el.setAttribute('data-focus', '');
				// Settings without a version predate the 'auto' corners, when 'none' was the default.
				var r = s.version === undefined && s.radius === 'none' ? 'auto' : s.radius;
				if (r && r !== 'auto') el.setAttribute('data-radius', r);
				if (s.textSize && s.textSize !== 'default') el.setAttribute('data-text', s.textSize);
				if (s.reduceMotion === true) el.setAttribute('data-reduce-motion', '');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
